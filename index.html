<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PF1e Character Builder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>PF1e Character Builder</h1>
    <p class="subtitle">Level 1</p>
  </header>

  <p id="loading">Loading rules data…</p>

  <main id="app" hidden>
    <section class="card">
      <h2>Race</h2>
      <select id="race"></select>
      <div id="race-info" class="info"></div>
    </section>

    <section class="card">
      <h2>Class</h2>
      <select id="class"></select>
      <div id="class-info" class="info"></div>
    </section>

    <section class="card wide">
      <h2>Ability scores</h2>
      <div class="row">
        <label>Point buy
          <select id="budget"></select>
        </label>
        <span id="points" class="points"></span>
      </div>
      <label id="flexible-row" class="row" hidden>Racial +2 to
        <select id="flexible"></select>
      </label>
      <table class="abilities">
        <thead>
          <tr><th>Ability</th><th>Base</th><th>Race</th><th>Score</th><th>Mod</th></tr>
        </thead>
        <tbody id="ability-rows"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Armor</h2>
      <p class="hint">No equipment list yet. Type the armor and shield bonus from your gear.</p>
      <label class="row">Armor bonus <input id="armor" type="number" min="0" max="20" value="0" inputmode="numeric"></label>
      <label class="row">Shield bonus <input id="shield" type="number" min="0" max="10" value="0" inputmode="numeric"></label>
      <fieldset>
        <legend>Favored class bonus</legend>
        <label><input type="radio" name="favored" value="hp" checked> +1 hit point</label>
        <label><input type="radio" name="favored" value="skill"> +1 skill rank</label>
      </fieldset>
    </section>

    <section class="card results">
      <h2>Results</h2>
      <dl id="results"></dl>
    </section>
  </main>

  <footer>
    Rules content is Open Game Content under the <a href="LICENSE-OGL.txt">Open Game License 1.0a</a>.
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
