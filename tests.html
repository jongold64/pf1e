<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rules checks</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    .pass { color: #1a7f37; }
    .fail { color: #cf222e; font-weight: bold; }
    li { margin: .2rem 0; }
  </style>
</head>
<body>
  <h1>Rules checks</h1>
  <p id="summary">Running…</p>
  <ul id="list"></ul>
  <script>
    // If a check crashes, say so instead of staying on "Running…".
    const crashed = message => {
      const el = document.getElementById('summary');
      el.className = 'fail';
      el.textContent = `The checks stopped with an error: ${message}`;
    };
    window.addEventListener('error', e => crashed(`${e.message} (${e.filename}:${e.lineno})`));
    window.addEventListener('unhandledrejection', e => crashed(e.reason && e.reason.stack || e.reason));
  </script>
  <script type="module" src="js/rules.test.js"></script>
</body>
</html>
